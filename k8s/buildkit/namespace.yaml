apiVersion: v1
kind: Namespace
metadata:
  name: buildkit
  labels:
    # Rootless buildkitd needs an unconfined seccomp profile and, on AppArmor
    # nodes, an unconfined AppArmor annotation on the pod; "baseline" allows
    # both, "restricted" would not.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
