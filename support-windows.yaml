# The real EOL clock.  scripts/eol_check.py reads this in every pipeline and
# fails when a window is expired or within 30 days (warns at 90).  Update it
# when re-pinning a line or the base OS.  Sources: endoflife.date/rhel (Red
# Hat product life cycle) and Atlassian's Data Center bug-fix / LTS policy.
#
# Each product has two lines, matching <product>/lts and <product>/latest:
#   lts     Long Term Support: security fixes for two years from the .0 release
#   latest  the current feature release: supported until the next feature
#           release ships plus the bug-fix window, so `support_ends` is short
#           and moves every time the line is re-pinned; `null` reports as
#           "unknown" (warning only) until you set it from the release notes.
base_os:
  name: RHEL 9 / UBI 9
  full_support_ends: 2027-05-31
  maintenance_ends: 2032-05-31
products:
  jira:
    lts:
      line: "11.3"
      # Jira LTS lines: 9.4, 9.12, 10.3, 11.3 (one per year); 11.3 shipped Dec 2025.
      support_ends: 2027-12-01
      note: "verify against https://confluence.atlassian.com/jirasoftware/jira-software-release-notes"
    latest:
      line: "11.6"
      support_ends: null
      note: "set from the release notes when re-pinning jira/latest"
  confluence:
    lts:
      line: "9.2"
      support_ends: 2026-12-11
      note: "9.2 LTS (Dec 2024); move confluence/lts to the next LTS line before this date"
    latest:
      line: "10.1"
      support_ends: null
      note: "set from the release notes when re-pinning confluence/latest"
  bitbucket:
    lts:
      line: "9.4"
      support_ends: 2027-01-21
      note: "9.4 LTS (Jan 2025)"
    latest:
      line: "10.1"
      support_ends: null
      note: "set from the release notes when re-pinning bitbucket/latest"
